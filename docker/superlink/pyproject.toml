[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentishub-superlink"
version = "1.0.0"
description = "MentisHub SuperLink federated learning coordination"
dependencies = ["flwr[simulation]>=1.25.0,<2.0"]

[tool.flwr.app]
publisher = "mentishub"

[tool.flwr.app.components]
serverapp = "flwr.server:ServerApp"
clientapp = "flwr.client:ClientApp"

[tool.flwr.federations]
default = "local-deployment"

[tool.flwr.federations.local-deployment]
address = "localhost:9093"
root-certificates = "ca.crt"
