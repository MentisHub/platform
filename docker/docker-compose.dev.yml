services:
  platform-backend:
    container_name: platform-backend
    build:
      context: ../
      dockerfile: apps/backend/docker/Dockerfile.dev
    volumes:
      - ..:/usr/src/app
      - backend-deps:/usr/src/app/node_modules
      - pnpm-cache:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT}/${POSTGRES_DB}
      SERVICE_DATABASE_URL: postgres://service_account:${POSTGRES_SERVICE_PASSWORD}@supabase-db:${POSTGRES_PORT}/${POSTGRES_DB}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
      OTEL_EXPORTER_URL: http://otel-collector:4318
      OTEL_SERVICE_NAME: platform
    networks:
      - mentishub-network
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  platform-frontend:
    container_name: platform-frontend
    build:
      context: ../
      dockerfile: apps/frontend/docker/Dockerfile.dev
    volumes:
      - ..:/usr/src/app
      - frontend-deps:/usr/src/app/node_modules
      - pnpm-cache:/root/.local/share/pnpm/store
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
    networks:
      - mentishub-network
    depends_on:
      - platform-backend

  vault:
    image: hashicorp/vault:1.21
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_API_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
      - ./vault/config.hcl:/vault/config/config.hcl
    networks:
      - mentishub-network
    command: server
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:8200/sys/health?standbyok=true",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  vault-init:
    image: hashicorp/vault:1.21
    container_name: vault-init
    volumes:
      - vault_data:/vault/file
      - ./vault/init.sh:/init.sh:ro
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
    networks:
      - mentishub-network
    entrypoint: /bin/sh
    command: ["/init.sh"]
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

volumes:
  vault_data:
  backend-deps:
  frontend-deps:
  pnpm-cache:
