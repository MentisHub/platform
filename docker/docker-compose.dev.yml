services:
  vault-agent-backend:
    image: hashicorp/vault:1.21
    container_name: vault-agent-backend
    user: "0:0"
    volumes:
      - vault_certs:/etc/backend/creds:ro
      - backend_certs:/etc/backend/certs
      - ./vault-agent.hcl:/vault/config/vault-agent.hcl:ro
      - ./templates:/vault/templates:ro
    networks:
      - mentishub-network
    entrypoint: ["/bin/sh", "-c"]
    command: ["vault agent -config=/vault/config/vault-agent.hcl"]
    depends_on:
      vault-init:
        condition: service_completed_successfully
    restart: unless-stopped

  platform-backend:
    container_name: platform-backend
    build:
      context: ../
      dockerfile: apps/backend/docker/Dockerfile.dev
    volumes:
      - ..:/usr/src/app
      - backend-deps:/usr/src/app/node_modules
      - pnpm-cache:/root/.local/share/pnpm/store
      - backend_certs:/etc/backend/certs:ro
      - vault_certs:/vault/creds:ro
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT}/${POSTGRES_DB}
      SERVICE_DATABASE_URL: postgres://service_account:${POSTGRES_SERVICE_PASSWORD}@supabase-db:${POSTGRES_PORT}/${POSTGRES_DB}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /vault/creds/platform-role-id
      VAULT_SECRET_ID_FILE: /vault/creds/platform-secret-id
      OTEL_EXPORTER_URL: https://otel-collector:4318
      BACKEND_CERT_PATH: /etc/backend/certs/backend.crt
      BACKEND_KEY_PATH: /etc/backend/certs/backend.key
      BACKEND_CA_PATH: /etc/backend/certs/ca.crt
    networks:
      - mentishub-network
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
      vault-agent-backend:
        condition: service_started
      otel-collector:
        condition: service_started

  platform-frontend:
    container_name: platform-frontend
    build:
      context: ../
      dockerfile: apps/frontend/docker/Dockerfile.dev
    volumes:
      - ..:/usr/src/app
      - frontend-deps:/usr/src/app/node_modules
      - pnpm-cache:/root/.local/share/pnpm/store
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
    networks:
      - mentishub-network
    depends_on:
      - platform-backend

volumes:
  backend-deps:
  frontend-deps:
  pnpm-cache:
  backend_certs:
