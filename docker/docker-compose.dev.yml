services:
  platform-backend:
    container_name: platform-backend
    build:
      context: ../
      dockerfile: apps/backend/docker/Dockerfile.dev
    volumes:
      - ..:/usr/src/app
      - backend-deps:/usr/src/app/node_modules
      - pnpm-cache:/root/.local/share/pnpm/store
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../docker:/usr/src/app/platform/docker:ro
      - ../../certs:/usr/src/app/certs:ro
      - ../../flower/framework/proto/flwr:/opt/flower-proto/flwr:ro  # Mount local Flower protos
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT}/${POSTGRES_DB}
      SERVICE_DATABASE_URL: postgres://service_account:${POSTGRES_SERVICE_PASSWORD}@supabase-db:${POSTGRES_PORT}/${POSTGRES_DB}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PRIVATE_KEY_PATH: /usr/src/app/certs/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /usr/src/app/certs/jwt_public.pem
      BASE_URL: http://platform-backend:3000
      OTEL_EXPORTER_URL: https://otel-collector:4317
      BACKEND_CERT_PATH: /usr/src/app/certs/server.crt
      BACKEND_KEY_PATH: /usr/src/app/certs/server.key
      BACKEND_CA_PATH: /usr/src/app/certs/ca.crt
      DOCKER_SOCKET: /var/run/docker.sock
      SUPERLINK_HOST: superlink
    networks:
      - mentishub-network
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  platform-frontend:
    container_name: platform-frontend
    build:
      context: ../
      dockerfile: apps/frontend/docker/Dockerfile.dev
    volumes:
      - ..:/usr/src/app
      - frontend-deps:/usr/src/app/node_modules
      - pnpm-cache:/root/.local/share/pnpm/store
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
    networks:
      - mentishub-network
    depends_on:
      - platform-backend

  superlink:
    container_name: superlink
    build:
      context: ../../flower
      dockerfile: ../platform/docker/flower/superlink.Dockerfile
    command:
      - --ssl-certfile=/certs/server.crt
      - --ssl-keyfile=/certs/server.key
      - --ssl-ca-certfile=/certs/ca.crt
      - --enable-supernode-auth
      - --isolation
      - process
      - --database=/data/state.db
    volumes:
      - ../../certs:/certs:ro
    ports:
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    networks:
      - mentishub-network
    restart: unless-stopped

volumes:
  backend-deps:
  frontend-deps:
  pnpm-cache:
